<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的评价</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 20px 15px; }
        .review-item {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .review-title { font-weight: bold; }
        .review-time { font-size: 14px; color: #999; }
        .review-content { line-height: 1.6; color: #333; }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="header-title">我的评价</div>
    </div>

    <div class="empty-tip">暂无评价记录，服务完成后可提交评价</div>

    <script src="js/main.js"></script>
</body>
</html>
