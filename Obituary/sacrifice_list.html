<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>祭日清单</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 20px 15px; }
        .sacrifice-item {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info { flex: 1; }
        .name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .next-day { font-size: 14px; color: #2979ff; }
        .view-btn {
            padding: 6px 12px;
            background-color: #2979ff;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="header-title">祭日清单</div>
    </div>

    <div class="sacrifice-item">
        <div class="info">
            <div class="name">高山女士</div>
            <div class="next-day">下一个祭日：2026-08-08（忌日）</div>
        </div>
        <button class="view-btn" onclick="location.href='sacrifice_calendar.html'">查看</button>
    </div>

    <div class="empty-tip">可在讣告中添加逝者信息，自动生成祭日清单</div>

    <script src="js/main.js"></script>
</body>
</html>
