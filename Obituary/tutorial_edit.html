<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>讣告修改教程</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {padding: 20px 15px;}
        .content-wrap {line-height: 1.8; font-size: 16px;}
        .step {margin-bottom: 15px;}
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="header-title">讣告修改教程</div>
    </div>

    <div class="content-wrap">
        <div class="step">1、首页点击【修改讣告】进入编辑页面。</div>
        <div class="step">2、直接修改姓名、日期、正文等内容。</div>
        <div class="step">3、确认内容无误后，点击【保存修改】即可完成更新。</div>
        <div class="step">4、支持多次重复编辑修改。</div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
