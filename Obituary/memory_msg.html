<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>追思留言</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 20px 15px; }
        .msg-item {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .msg-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .msg-user { font-weight: bold; color: #2979ff; }
        .msg-time { font-size: 14px; color: #999; }
        .msg-content { line-height: 1.6; color: #333; }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="header-title">追思留言</div>
    </div>

    <div class="msg-item">
        <div class="msg-header">
            <span class="msg-user">侯力</span>
            <span class="msg-time">2022-07-11</span>
        </div>
        <div class="msg-content">以前很忙，心里总是挂念你，现在很空，身边没有了你，只剩下心头的怀念。</div>
    </div>

    <div class="empty-tip">暂无更多留言记录</div>

    <script src="js/main.js"></script>
</body>
</html>
