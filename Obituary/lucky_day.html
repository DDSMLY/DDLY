<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>吉日查询</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #f5f7fa; padding: 15px; }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .ym-select {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .ym-select button {
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
        }
        .ym-text { font-size: 18px; font-weight: bold; color: #2979ff; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th {
            background: #2979ff;
            color: #fff;
            padding: 10px 0;
            font-weight: normal;
        }
        td {
            padding: 12px 0;
            border: 1px solid #eee;
            background: #fff;
        }
        .today { background: #e3f2fd; color: #2979ff; font-weight: bold; border-radius: 50%; }
        .empty-day { background: #fafafa; }
        .good-day { color: #2979ff; font-weight: bold; }
        .detail { margin-top: 15px; line-height: 1.8; }
        .detail span { display: inline-block; width: 60px; color: #2979ff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="header-title">吉日查询</div>
    </div>

    <div class="card">
        <div class="ym-select">
            <button onclick="prevMonth()">上月</button>
            <div class="ym-text" id="ymText">2026年6月</div>
            <button onclick="nextMonth()">下月</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>日</th>
                    <th>一</th>
                    <th>二</th>
                    <th>三</th>
                    <th>四</th>
                    <th>五</th>
                    <th>六</th>
                </tr>
            </thead>
            <tbody id="calendarBody">
                <!-- JS 填充日历 -->
            </tbody>
        </table>
    </div>

    <div class="card" id="detailCard">
        <div class="detail">
            <p><span>日期：</span><span id="dDate">2026-06-09</span></p>
            <p><span>宜：</span><span id="dYi">祭祀、祈福、安葬、立碑、入殓、移柩</span></p>
            <p><span>忌：</span><span id="dJi">嫁娶、开市、破土、作梁、纳畜</span></p>
            <p><span>冲煞：</span><span id="dChong">冲兔(乙卯)煞东</span></p>
        </div>
    </div>

    <script>
        let now = new Date();
        let currentYear = now.getFullYear();
        let currentMonth = now.getMonth();
        let currentDay = now.getDate();

        // 黄历简易数据（可按需要扩展）
        const hlData = {
            "2026-06-08": { yi: "祭祀、祈福、安葬、立碑", ji: "嫁娶、开市、破土", chong: "冲虎煞南" },
            "2026-06-09": { yi: "祭祀、祈福、安葬、立碑、入殓、移柩", ji: "嫁娶、开市、破土、作梁、纳畜", chong: "冲兔(乙卯)煞东" },
            "2026-06-10": { yi: "祭祀、出行、解除、拆卸、修造", ji: "嫁娶、开市、破土、安葬", chong: "冲龙煞北" },
            "2026-06-11": { yi: "祭祀、祈福、开光、出行、解除", ji: "嫁娶、开市、破土、作梁", chong: "冲蛇煞西" }
        };

        function renderCalendar(y, m) {
            const first = new Date(y, m, 1);
            const last = new Date(y, m + 1, 0);
            let html = "";
            let day = 1;
            const todayStr = `${y}-${String(m+1).padStart(2,'0')}-${String(currentDay).padStart(2,'0')}`;

            for (let i = 0; i < 6; i++) {
                html += "<tr>";
                for (let j = 0; j < 7; j++) {
                    if (i === 0 && j < first.getDay()) {
                        html += '<td class="empty-day"></td>';
                    } else if (day > last.getDate()) {
                        html += '<td class="empty-day"></td>';
                    } else {
                        const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                        let cls = "";
                        if (dStr === todayStr) cls = "today";
                        // 简单把有宜安葬的标为吉日
                        if (hlData[dStr] && hlData[dStr].yi.includes("安葬")) cls = "good-day";

                        html += `<td class="${cls}" onclick="showDetail('${dStr}')">${day}</td>`;
                        day++;
                    }
                }
                html += "</tr>";
                if (day > last.getDate()) break;
            }
            document.getElementById("calendarBody").innerHTML = html;
            document.getElementById("ymText").innerText = `${y}年${m+1}月`;
        }

        function showDetail(d) {
            document.getElementById("dDate").innerText = d;
            if (hlData[d]) {
                document.getElementById("dYi").innerText = hlData[d].yi;
                document.getElementById("dJi").innerText = hlData[d].ji;
                document.getElementById("dChong").innerText = hlData[d].chong;
            } else {
                document.getElementById("dYi").innerText = "无";
                document.getElementById("dJi").innerText = "无";
                document.getElementById("dChong").innerText = "无";
            }
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        }
        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        }

        // 初始化
        renderCalendar(currentYear, currentMonth);
        showDetail(`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(currentDay).padStart(2,'0')}`);
    </script>
</body>
</html>
