<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>专属纪念堂</title>
    <!-- 字体图标 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "SimSun", serif;
        }

        :root {
            --main-gold: #d4b886;
            --light-gold: #e9d7b8;
            --dark-bg: #121624;
            --card-bg: rgba(30, 36, 58, 0.85);
            --text-primary: #f5f1e8;
            --text-secondary: #c9c2b3;
            --border-gold: rgba(212, 184, 134, 0.35);
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(212, 184, 134, 0.08), transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4b886' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            min-height: 100vh;
            color: var(--text-primary);
            padding-bottom: 150px;
        }

        /* 全局装饰分割线 */
        .divider {
            width: 70%;
            height: 1px;
            margin: 30px auto;
            background: linear-gradient(90deg, transparent, var(--main-gold), transparent);
            position: relative;
        }
        .divider::before, .divider::after {
            content: "❦";
            position: absolute;
            top: -10px;
            color: var(--main-gold);
            font-size: 16px;
        }
        .divider::before { left: 10%; }
        .divider::after { right: 10%; }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 25px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(212, 184, 134, 0.12);
            border: 1px solid var(--border-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light-gold);
            font-size: 18px;
            z-index: 999;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(212, 184, 134, 0.2);
        }

        /* 顶部主殿堂区域 - 核心视觉 */
        .memorial-top {
            padding: 100px 20px 50px;
            text-align: center;
        }
        .avatar-frame {
            width: 190px;
            height: 230px;
            margin: 0 auto 25px;
            padding: 8px;
            background: linear-gradient(135deg, var(--main-gold), var(--light-gold));
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(212, 184, 134, 0.25);
        }
        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #0e121e;
            border-radius: 8px;
            overflow: hidden;
        }
        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .deceased-name {
            font-size: 34px;
            letter-spacing: 8px;
            color: var(--light-gold);
            font-weight: 500;
            text-shadow: 0 0 15px rgba(212, 184, 134, 0.3);
            margin-bottom: 12px;
        }
        .birth-death {
            font-size: 17px;
            color: var(--text-secondary);
            letter-spacing: 3px;
        }
        .epitaph {
            margin-top: 15px;
            font-size: 15px;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* 通用卡片样式 - 分层华丽卡片 */
        .card-wrap {
            width: 94%;
            margin: 0 auto 30px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 18px;
            padding: 26px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(212, 184, 134, 0.1);
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            color: var(--main-gold);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .card-title i {
            font-size: 22px;
        }

        /* 一、基础信息板块 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .info-item {
            padding: 14px 16px;
            background: rgba(212, 184, 134, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(212, 184, 134, 0.15);
        }
        .info-label {
            color: var(--text-secondary);
            font-size: 14px;
            display: block;
            margin-bottom: 4px;
        }
        .info-value {
            color: var(--text-primary);
            font-size: 16px;
        }

        /* 二、送别仪式行程板块 */
        .schedule-list .schedule-item {
            padding: 16px 0;
            border-bottom: 1px dashed rgba(212, 184, 134, 0.2);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .schedule-list .schedule-item:last-child {
            border-bottom: none;
        }
        .schedule-icon {
            color: var(--main-gold);
            font-size: 18px;
            margin-top: 3px;
        }
        .schedule-text h4 {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: normal;
        }
        .schedule-text p {
            font-size: 16px;
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* 三、生平追忆板块 */
        .life-content {
            line-height: 2.2;
            font-size: 16px;
            color: var(--text-primary);
            text-align: justify;
            text-indent: 2em;
        }

        /* 四、珍贵影像画廊 */
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .photo-item {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            aspect-ratio: 1;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .photo-item img:hover {
            transform: scale(1.08);
        }
        .empty-photo-tip {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
            font-size: 15px;
        }

        /* 五、点灯祈福板块 */
        .candle-desc {
            text-align: center;
            margin-bottom: 25px;
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .candle-count {
            font-size: 16px;
            color: var(--main-gold);
            margin-top: 8px;
        }
        .candle-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 22px;
            margin-bottom: 30px;
        }
        .candle {
            width: 48px;
            height: 60px;
            position: relative;
        }
        .candle-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #e9d7b8, #bfa77b);
            border-radius: 22px 22px 6px 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .candle-flame {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 30px;
            background: linear-gradient(180deg, #fff8e0, #ffd870, #ff9a2e);
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            opacity: 0;
            filter: blur(1px);
        }
        .candle.lit .candle-flame {
            opacity: 1;
            animation: flameFlicker 1.1s infinite alternate ease-in-out;
        }
        @keyframes flameFlicker {
            0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
            100% { transform: translateX(-50%) scale(1.15) rotate(3deg); }
        }
        .light-btn {
            display: block;
            width: 180px;
            margin: 0 auto;
            padding: 12px;
            background: linear-gradient(135deg, rgba(212, 184, 134, 0.15), rgba(212, 184, 134, 0.05));
            border: 1px solid var(--border-gold);
            color: var(--light-gold);
            border-radius: 32px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .light-btn:hover {
            background: linear-gradient(135deg, rgba(212, 184, 134, 0.25), rgba(212, 184, 134, 0.1));
        }

        /* 六、追思留言板块 */
        .msg-item {
            background: rgba(212, 184, 134, 0.05);
            border: 1px solid rgba(212, 184, 134, 0.15);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .msg-user {
            font-size: 16px;
            color: var(--main-gold);
            margin-bottom: 6px;
        }
        .msg-time {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .msg-content {
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1.8;
        }
        .write-msg-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: linear-gradient(135deg, rgba(212, 184, 134, 0.15), rgba(212, 184, 134, 0.05));
            border: 1px solid var(--border-gold);
            color: var(--light-gold);
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .write-msg-btn:hover {
            background: rgba(212, 184, 134, 0.2);
        }

        /* 留言弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-box {
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 18px;
            padding: 28px;
            backdrop-filter: blur(12px);
        }
        .modal-title {
            font-size: 18px;
            color: var(--main-gold);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .modal-input, .modal-textarea {
            width: 100%;
            background: rgba(212, 184, 134, 0.05);
            border: 1px solid rgba(212, 184, 134, 0.2);
            border-radius: 10px;
            padding: 14px;
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 15px;
            outline: none;
        }
        .modal-textarea {
            height: 120px;
            resize: none;
        }
        .modal-btn-group {
            display: flex;
            gap: 12px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: var(--text-secondary);
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--main-gold), var(--light-gold));
            color: #121624;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- 返回按钮 -->
    <div class="back-btn" onclick="history.back()">
        <i class="fas fa-arrow-left"></i>
    </div>

    <!-- 顶部主视觉区域 -->
    <div class="memorial-top">
        <div class="avatar-frame">
            <div class="avatar-inner" id="mainAvatar"></div>
        </div>
        <h1 class="deceased-name" id="fullName">故人</h1>
        <div class="birth-death" id="birthDeath">生于 — 逝于</div>
        <div class="epitaph">音容宛在，永世难忘</div>
    </div>

    <div class="divider"></div>

    <!-- 1. 基础信息卡片 -->
    <div class="card-wrap">
        <div class="card">
            <div class="card-title">
                <i class="fas fa-user-circle"></i> 逝者基本信息
            </div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">性别</span>
                    <span class="info-value" id="genderVal">暂无</span>
                </div>
                <div class="info-item">
                    <span class="info-label">出生日期</span>
                    <span class="info-value" id="birthVal">暂无</span>
                </div>
                <div class="info-item">
                    <span class="info-label">逝世日期</span>
                    <span class="info-value" id="deathVal">暂无</span>
                </div>
                <div class="info-item">
                    <span class="info-label">墓碑/墓穴位置</span>
                    <span class="info-value" id="tombVal">暂无</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 送别仪式行程卡片 -->
    <div class="card-wrap">
        <div class="card">
            <div class="card-title">
                <i class="fas fa-calendar-days"></i> 送别仪式安排
            </div>
            <div class="schedule-list">
                <div class="schedule-item">
                    <div class="schedule-icon"><i class="fas fa-home"></i></div>
                    <div class="schedule-text">
                        <h4>灵堂设置地点</h4>
                        <p id="lingtangVal">暂未登记</p>
                    </div>
                </div>
                <div class="schedule-item">
                    <div class="schedule-icon"><i class="fas fa-pray"></i></div>
                    <div class="schedule-text">
                        <h4>告别会时间</h4>
                        <p id="farewellTimeVal">暂未登记</p>
                    </div>
                </div>
                <div class="schedule-item">
                    <div class="schedule-icon"><i class="fas fa-map-marker-alt"></i></div>
                    <div class="schedule-text">
                        <h4>告别会地址</h4>
                        <p id="farewellAddrVal">暂未登记</p>
                    </div>
                </div>
                <div class="schedule-item">
                    <div class="schedule-icon"><i class="fas fa-utensils"></i></div>
                    <div class="schedule-text">
                        <h4>答谢宴时间</h4>
                        <p id="thankTimeVal">暂未登记</p>
                    </div>
                </div>
                <div class="schedule-item">
                    <div class="schedule-icon"><i class="fas fa-location-dot"></i></div>
                    <div class="schedule-text">
                        <h4>答谢宴地址</h4>
                        <p id="thankAddrVal">暂未登记</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 生平追忆卡片 -->
    <div class="card-wrap">
        <div class="card">
            <div class="card-title">
                <i class="fas fa-book-open"></i> 生平追忆
            </div>
            <div class="life-content" id="lifeContentVal">
                暂无生平介绍，愿逝者安息，生者缅怀。
            </div>
        </div>
    </div>

    <!-- 4. 珍贵回忆影像卡片 -->
    <div class="card-wrap">
        <div class="card">
            <div class="card-title">
                <i class="fas fa-images"></i> 珍贵回忆影像
            </div>
            <div class="photo-gallery" id="photoGalleryBox"></div>
        </div>
    </div>

    <!-- 5. 点灯祈福卡片 -->
    <div class="card-wrap">
        <div class="card">
            <div class="card-title" style="justify-content: center;">
                <i class="fas fa-fire-flame-curved"></i> 点灯祈福
            </div>
            <div class="candle-desc">
                点亮一盏烛光，寄去无限哀思<br>
                <span class="candle-count">当前已有 <span id="candleTotal">0</span> 位亲友点亮烛光</span>
            </div>
            <div class="candle-container" id="candleBox"></div>
            <button class="light-btn" onclick="lightCandle()">🕯️ 为故人点亮烛光</button>
        </div>
    </div>

    <!-- 6. 亲友追思留言卡片 -->
    <div class="card-wrap">
        <div class="card">
            <div class="card-title">
                <i class="fas fa-comments"></i> 亲友追思寄语
            </div>
            <div id="messageListBox"></div>
            <button class="write-msg-btn" onclick="openMsgModal()">✍️ 写下我的追思</button>
        </div>
    </div>

    <!-- 留言弹窗 -->
    <div class="modal" id="msgModal">
        <div class="modal-box">
            <div class="modal-title">留下追思寄语</div>
            <input class="modal-input" id="inputName" placeholder="请输入您的称呼">
            <textarea class="modal-textarea" id="inputContent" placeholder="写下心中的缅怀与思念..."></textarea>
            <div class="modal-btn-group">
                <button class="modal-btn btn-cancel" onclick="closeMsgModal()">取消</button>
                <button class="modal-btn btn-submit" onclick="submitMessage()">提交寄语</button>
            </div>
        </div>
    </div>

    <script>
        // 读取本地存储数据
        const memorialData = JSON.parse(localStorage.getItem("memorialData")) || {};
        let candleNum = parseInt(localStorage.getItem("totalCandle")) || 0;
        let messageArr = JSON.parse(localStorage.getItem("memorialMessage")) || [];

        // ========== 填充基础信息 ==========
        document.getElementById("fullName").innerText = memorialData.name || "无名故人";
        document.getElementById("birthDeath").innerText = `${memorialData.birth || "未知年份"} — ${memorialData.death || "未知年份"}`;
        document.getElementById("genderVal").innerText = memorialData.gender || "暂无";
        document.getElementById("birthVal").innerText = memorialData.birth || "暂无";
        document.getElementById("deathVal").innerText = memorialData.death || "暂无";
        document.getElementById("tombVal").innerText = memorialData.tombAddr || "暂无";

        // 仪式行程
        document.getElementById("lingtangVal").innerText = memorialData.lingtangAddr || "暂未登记";
        document.getElementById("farewellTimeVal").innerText = memorialData.farewellTime || "暂未登记";
        document.getElementById("farewellAddrVal").innerText = memorialData.farewellAddr || "暂未登记";
        document.getElementById("thankTimeVal").innerText = memorialData.thankyouTime || "暂未登记";
        document.getElementById("thankAddrVal").innerText = memorialData.thankyouAddr || "暂未登记";

        // 生平内容
        document.getElementById("lifeContentVal").innerText = memorialData.content || "暂无生平介绍，愿逝者安息，生者缅怀。";

        // 遗像
        if (memorialData.avatar) {
            document.getElementById("mainAvatar").innerHTML = `<img src="${memorialData.avatar}" alt="遗像">`;
        }

        // ========== 回忆照片画廊 ==========
        function renderPhoto() {
            let html = "";
            if (memorialData.lifePhotos && memorialData.lifePhotos.length > 0) {
                memorialData.lifePhotos.forEach(photo => {
                    html += `<div class="photo-item"><img src="${photo}" alt="回忆照片"></div>`;
                })
            } else {
                html = `<div class="empty-photo-tip">暂无留存的回忆照片</div>`;
            }
            document.getElementById("photoGalleryBox").innerHTML = html;
        }
        renderPhoto();

        // ========== 烛光祈福 ==========
        document.getElementById("candleTotal").innerText = candleNum;
        const candleMax = 12; // 页面最多展示12支蜡烛
        function renderCandle() {
            let html = "";
            for (let i = 0; i < candleMax; i++) {
                let isLit = i < (candleNum % candleMax);
                html += `
                    <div class="candle ${isLit ? 'lit' : ''}">
                        <div class="candle-flame"></div>
                        <div class="candle-body"></div>
                    </div>
                `;
            }
            document.getElementById("candleBox").innerHTML = html;
        }
        renderCandle();

        // 点亮蜡烛
        function lightCandle() {
            candleNum++;
            localStorage.setItem("totalCandle", candleNum);
            document.getElementById("candleTotal").innerText = candleNum;
            renderCandle();
            alert("🕯️ 烛光已点亮，愿故人一路安好，福泽绵长");
        }

        // ========== 追思留言 ==========
        function renderMessage() {
            let html = "";
            if (messageArr.length === 0) {
                html = `
                    <div class="msg-item">
                        <div class="msg-content">暂无亲友留言，愿思念长存，故人安息。</div>
                    </div>
                `;
            } else {
                messageArr.forEach(msg => {
                    html += `
                        <div class="msg-item">
                            <div class="msg-user">${msg.userName}</div>
                            <div class="msg-time">${msg.createTime}</div>
                            <div class="msg-content">${msg.content}</div>
                        </div>
                    `;
                })
            }
            document.getElementById("messageListBox").innerHTML = html;
        }
        renderMessage();

        // 留言弹窗操作
        function openMsgModal() {
            document.getElementById("msgModal").style.display = "flex";
        }
        function closeMsgModal() {
            document.getElementById("msgModal").style.display = "none";
            document.getElementById("inputName").value = "";
            document.getElementById("inputContent").value = "";
        }
        function submitMessage() {
            let userName = document.getElementById("inputName").value.trim();
            let content = document.getElementById("inputContent").value.trim();
            if (!userName || !content) {
                alert("请填写您的称呼与追思内容！");
                return;
            }
            // 新增留言，倒序展示
            messageArr.unshift({
                userName: userName,
                content: content,
                createTime: new Date().toLocaleString()
            });
            localStorage.setItem("memorialMessage", JSON.stringify(messageArr));
            renderMessage();
            closeMsgModal();
            alert("❤️ 您的追思寄语已成功留存！");
        }
    </script>
</body>
</html>
