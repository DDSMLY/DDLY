<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>讣告领取教程</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {padding: 20px 15px;}
        .content-wrap {line-height: 1.8; font-size: 16px;}
        .step {margin-bottom: 15px;}
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="header-title">讣告领取教程</div>
    </div>

    <div class="content-wrap">
        <div class="step">1、进入服务号首页，点击【修改讣告】入口。</div>
        <div class="step">2、按页面提示填写逝者相关信息。</div>
        <div class="step">3、填写完成后点击【保存修改】，即可生成并领取讣告。</div>
        <div class="step">4、生成后可直接转发、保存图片使用。</div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
