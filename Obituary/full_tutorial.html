<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>完整教程</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {padding: 20px 15px;}
        .content-wrap {line-height: 1.8; font-size: 16px;}
        .title-s {
            font-weight: bold;
            font-size: 17px;
            margin: 20px 0 10px;
            color: #6A5ACD;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="header-title">完整使用教程</div>
    </div>

    <div class="content-wrap">
        <div class="title-s">一、讣告使用</div>
        <p>进入首页修改讣告，填写信息后保存即可生成、转发使用。</p>

        <div class="title-s">二、追思卡制作</div>
        <p>点击追思卡入口，填写姓名与寄语，一键生成专属追思卡。</p>

        <div class="title-s">三、随礼金与留言</div>
        <p>可随时查看亲友随礼名单、亲友悼念留言。</p>

        <div class="title-s">四、祭日查询</div>
        <p>输入姓名与逝世日期，快速查询各类祭日时间。</p>

        <div class="title-s">五、助孝金提现</div>
        <p>填写收款信息提交申请，审核完成后自动到账。</p>

        <div class="title-s">六、联系客服</div>
        <p>使用中遇到问题，可直接拨打首页客服电话咨询。</p>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
