<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建纪念堂</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
        body{background:#f5f7fa;padding:30px 20px;text-align:center}
        .avatar{width:160px;height:200px;background:#fff;border:2px dashed #ccc;border-radius:10px;margin:30px auto;display:flex;align-items:center;justify-content:center;color:#666}
        .avatar img{width:100%;height:100%;object-fit:cover;border-radius:10px}
        .name{font-size:24px;margin:20px 0;color:#333}
        .btn{background:#4A5A8C;color:#fff;border:none;padding:14px 30px;border-radius:30px;font-size:16px;margin-top:30px}
    </style>
</head>
<body>

<div class="avatar" id="avatarBox">上传头像</div>
<div class="name" id="nameText">加载中...</div>
<button class="btn" onclick="goMemorial()">进入纪念堂</button>

<script>
    const obit = JSON.parse(localStorage.getItem("obituaryData")) || {}
    window.onload = function(){
        if(obit.avatar){
            document.getElementById("avatarBox").innerHTML = `<img src="${obit.avatar}">`
        }
        document.getElementById("nameText").innerText = obit.name || "无名逝者"
    }
    function goMemorial(){
        localStorage.setItem("memorialData", JSON.stringify(obit))
        location.href="hall_detail.html"
    }
</script>
</body>
</html>
