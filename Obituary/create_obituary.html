<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新建/编辑讣告</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei",sans-serif}
        body{background:#f5f7fa;padding:20px 15px}
        .page-header{display:flex;align-items:center;margin-bottom:20px}
        .back-btn{background:#2979ff;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer}
        .header-title{flex:1;text-align:center;font-size:19px;font-weight:bold}
        .form-item{margin-bottom:18px}
        .form-label{font-size:15px;margin-bottom:6px;display:block;color:#333}
        .form-input,.form-textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:15px}
        .form-textarea{min-height:120px;resize:none}

        .upload-box{width:120px;height:120px;border:1px dashed #ccc;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;color:#666;margin-top:6px}
        .upload-box input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}
        .upload-preview{width:100%;height:100%;object-fit:cover;border-radius:8px;display:none}

        .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
        .photo-item{aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;background:#fff;border:1px solid #eee}
        .photo-item img{width:100%;height:100%;object-fit:cover}
        .photo-del{position:absolute;top:5px;right:5px;width:22px;height:22px;line-height:22px;text-align:center;background:rgba(255,80,80,0.8);color:#fff;border-radius:50%;font-size:12px;cursor:pointer}
        .photo-add{border:2px dashed #ccc;display:flex;align-items:center;justify-content:center;color:#888}
        .photo-add i{font-size:24px;margin-bottom:4px}

        .submit-btn{
            background:#2979ff;
            color:#fff;
            text-align:center;
            padding:14px;
            border-radius:8px;
            margin-top:25px;
            font-size:16px;
            border:none;
            width:100%;
            cursor:pointer;
        }
        .tip{color:red;font-size:14px;margin-top:8px;display:none}
    </style>
</head>
<body>

<div class="page-header">
    <button class="back-btn" onclick="history.back()">← 返回</button>
    <div class="header-title">新建/编辑讣告</div>
</div>

<div class="form-item">
    <label class="form-label">逝者姓名 *</label>
    <input type="text" class="form-input" id="name" placeholder="请输入逝者姓名">
</div>

<div class="form-item">
    <label class="form-label">性别 *</label>
    <input type="text" class="form-input" id="gender" placeholder="男/女">
</div>

<div class="form-item">
    <label class="form-label">出生日期 *</label>
    <input type="text" class="form-input" id="birth" placeholder="例如：1950-01-01">
</div>

<div class="form-item">
    <label class="form-label">逝世日期 *</label>
    <input type="text" class="form-input" id="death" placeholder="例如：2025-01-01">
</div>

<div class="form-item">
    <label class="form-label">逝者遗像（单张）*</label>
    <div class="upload-box">
        <img id="avatarPreview" class="upload-preview">
        <span>点击上传遗像</span>
        <input type="file" accept="image/*" id="avatarInput">
    </div>
</div>

<div class="form-item">
    <label class="form-label">生平回忆照片（多图）</label>
    <div class="photo-grid" id="photoGrid">
        <div class="photo-item photo-add" id="addPhoto">
            <i class="fas fa-plus"></i>
        </div>
    </div>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
</div>

<!-- ============================================== -->
<!-- 👇 这里只新增 4 个表单项，样式完全和你统一 -->
<!-- ============================================== -->
<div class="form-item">
    <label class="form-label">灵堂地址</label>
    <input type="text" class="form-input" id="lingtangAddr" placeholder="请填写灵堂详细地址">
</div>

<div class="form-item">
    <label class="form-label">告别会时间</label>
    <input type="text" class="form-input" id="farewellTime" placeholder="例如：2025-05-01 08:00">
</div>

<div class="form-item">
    <label class="form-label">告别会地址</label>
    <input type="text" class="form-input" id="farewellAddr" placeholder="请填写告别会地址">
</div>

<div class="form-item">
    <label class="form-label">答谢宴时间</label>
    <input type="text" class="form-input" id="thankyouTime" placeholder="例如：2025-05-01 11:30">
</div>

<div class="form-item">
    <label class="form-label">答谢宴地址</label>
    <input type="text" class="form-input" id="thankyouAddr" placeholder="请填写答谢宴地址">
</div>

<div class="form-item">
    <label class="form-label">墓碑位置</label>
    <input type="text" class="form-input" id="tombAddr" placeholder="请填写墓园/墓碑位置">
</div>
<!-- ============================================== -->
<!-- 👆 新增结束，其他完全不动 -->
<!-- ============================================== -->

<div class="form-item">
    <label class="form-label">生平简介 / 追思文 *</label>
    <textarea class="form-textarea" id="content" placeholder="请详细填写生平、品德、事迹、告别时间地点等"></textarea>
</div>

<button class="submit-btn" onclick="saveData()">✅ 保存讣告</button>
<div class="tip" id="errorTip"></div>

<script>
    let avatarBase64 = "";
    let lifePhotos = [];

    window.onload = function(){
        let data = localStorage.getItem("obituaryData");
        if(data){
            try{
                data = JSON.parse(data);
                document.getElementById("name").value = data.name || "";
                document.getElementById("gender").value = data.gender || "";
                document.getElementById("birth").value = data.birth || "";
                document.getElementById("death").value = data.death || "";
                document.getElementById("content").value = data.content || "";

                // 👇 新增：自动读取回填
                document.getElementById("lingtangAddr").value = data.lingtangAddr || "";
                document.getElementById("farewellTime").value = data.farewellTime || "";
                document.getElementById("farewellAddr").value = data.farewellAddr || "";
                document.getElementById("thankyouTime").value = data.thankyouTime || "";
                document.getElementById("thankyouAddr").value = data.thankyouAddr || "";
                document.getElementById("tombAddr").value = data.tombAddr || "";
                // 👆 新增结束

                if(data.avatar){
                    avatarBase64 = data.avatar;
                    document.getElementById("avatarPreview").src = avatarBase64;
                    document.getElementById("avatarPreview").style.display = "block";
                }

                if(Array.isArray(data.lifePhotos)){
                    lifePhotos = [...data.lifePhotos];
                    renderLifePhotos();
                }
            }catch(e){
                showTip("数据损坏，已清空，请重新填写");
                localStorage.removeItem("obituaryData");
            }
        }
    };

    // 压缩图片（防止太大存不进）
    function compressImg(file, maxSize=800){
        return new Promise(resolve=>{
            let reader = new FileReader();
            reader.onload = function(e){
                let img = new Image();
                img.onload = function(){
                    let canvas = document.createElement("canvas");
                    let w = img.width, h = img.height;
                    if(w>h && w>maxSize){h = h*maxSize/w;w=maxSize}
                    if(h>w && h>maxSize){w = w*maxSize/h;h=maxSize}
                    canvas.width=w;canvas.height=h;
                    let ctx = canvas.getContext("2d");
                    ctx.drawImage(img,0,0,w,h);
                    resolve(canvas.toDataURL("image/jpeg",0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // 遗像
    document.getElementById("avatarInput").addEventListener("change",async function(e){
        let file = e.target.files[0];
        if(!file)return;
        avatarBase64 = await compressImg(file);
        document.getElementById("avatarPreview").src = avatarBase64;
        document.getElementById("avatarPreview").style.display = "block";
    });

    // 生平照片
    document.getElementById("addPhoto").addEventListener("click",()=>document.getElementById("photoInput").click());
    document.getElementById("photoInput").addEventListener("change",async function(e){
        let files = e.target.files;
        for(let i=0;i<files.length;i++){
            let base64 = await compressImg(files[i]);
            lifePhotos.push(base64);
        }
        renderLifePhotos();
        this.value = "";
    });

    function renderLifePhotos(){
        let grid = document.getElementById("photoGrid");
        grid.innerHTML = `<div class="photo-item photo-add" id="addPhoto" onclick="document.getElementById('photoInput').click()"><i class="fas fa-plus"></i></div>`;
        lifePhotos.forEach((src,idx)=>{
            let item = document.createElement("div");
            item.className = "photo-item";
            item.innerHTML = `<img src="${src}"><div class="photo-del" onclick="delLifePhoto(${idx})">×</div>`;
            grid.insertBefore(item, document.getElementById("addPhoto"));
        });
    }

    function delLifePhoto(idx){
        lifePhotos.splice(idx,1);
        renderLifePhotos();
    }

    function showTip(msg){
        let tip = document.getElementById("errorTip");
        tip.innerText = msg;
        tip.style.display = "block";
        setTimeout(()=>tip.style.display="none",3000);
    }

    function saveData(){
        let name = document.getElementById("name").value.trim();
        let gender = document.getElementById("gender").value.trim();
        let birth = document.getElementById("birth").value.trim();
        let death = document.getElementById("death").value.trim();
        let content = document.getElementById("content").value.trim();

        // 👇 新增：获取输入框内容
        let lingtangAddr = document.getElementById("lingtangAddr").value.trim();
        let farewellTime = document.getElementById("farewellTime").value.trim();
        let farewellAddr = document.getElementById("farewellAddr").value.trim();
        let thankyouTime = document.getElementById("thankyouTime").value.trim();
        let thankyouAddr = document.getElementById("thankyouAddr").value.trim();
        let tombAddr = document.getElementById("tombAddr").value.trim();
        // 👆 新增结束

        // 必填校验
        if(!name){showTip("请填写逝者姓名");return;}
        if(!gender){showTip("请填写性别");return;}
        if(!birth){showTip("请填写出生日期");return;}
        if(!death){showTip("请填写逝世日期");return;}
        if(!avatarBase64){showTip("请上传逝者遗像");return;}
        if(!content){showTip("请填写生平简介");return;}

        let data = {
            name: name,
            gender: gender,
            birth: birth,
            death: death,
            avatar: avatarBase64,
            lifePhotos: lifePhotos,
            content: content,
            time: new Date().toLocaleString(),

            // 👇 新增：保存到数据
            lingtangAddr: lingtangAddr,
            farewellTime: farewellTime,
            farewellAddr: farewellAddr,
            thankyouTime: thankyouTime,
            thankyouAddr: thankyouAddr,
            tombAddr: tombAddr
            // 👆 新增结束
        };

        // 关键：try-catch 捕获存储失败
        try{
            localStorage.setItem("obituaryData", JSON.stringify(data));
            alert("✅ 保存成功！");
            location.href = "edit_obituary.html";
        }catch(e){
            console.error(e);
            if(e.message.includes("quota")){
                showTip("❌ 存储空间已满，删除几张照片再试");
            }else{
                showTip("❌ 保存失败：请关闭无痕模式，用 http 打开，或换浏览器");
            }
        }
    }
</script>
</body>
</html>
