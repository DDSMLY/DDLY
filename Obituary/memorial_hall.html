<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>纪念堂</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 20px 15px; background-color: #f5f7fa; }
        .hall-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .hall-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #eee;
            margin: 0 auto 15px;
        }
        .hall-name { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .hall-status { color: #2979ff; margin-bottom: 15px; }
        .hall-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2979ff;
            color: #fff;
            border-radius: 20px;
            font-size: 16px;
        }
        /* 新增上传样式 */
        .upload-wrap{
            margin: 15px auto;
            text-align: center;
        }
        .upload-box{
            width: 100px;
            height: 100px;
            border: 1px dashed #ccc;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        .upload-box input{
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            border-radius: 50%;
        }
        .upload-preview{
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: none;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="header-title">纪念堂</div>
    </div>

    <!-- 新增上传区域 -->
    <div class="upload-wrap">
        <div class="upload-box">
            <img id="hallAvatar" class="upload-preview">
            <span>上传逝者头像</span>
            <input type="file" accept="image/*" onchange="hallImgPreview(this)">
        </div>
    </div>

    <div class="hall-card">
        <div class="hall-avatar"></div>
        <div class="hall-name">高山女士</div>
        <div class="hall-status">纪念堂已创建，永久保存</div>
        <a href="memorial_detail.html" class="hall-btn">进入纪念堂</a>
    </div>

    <div class="empty-tip">可在讣告管理中为逝者创建纪念堂</div>

    <script src="js/main.js"></script>
    <script>
        function hallImgPreview(fileInput){
            let preview = document.getElementById('hallAvatar');
            if(fileInput.files && fileInput.files[0]){
                let reader = new FileReader();
                reader.onload = function(e){
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(fileInput.files[0]);
            }
        }
    </script>
</body>
</html>
