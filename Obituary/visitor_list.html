<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>来宾记录</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: "Microsoft YaHei",sans-serif; }
        body { background:#f5f7fa; padding:20px 15px; }
        .page-header { display:flex; align-items:center; margin-bottom:20px; }
        .back-btn { background:#2979ff; color:#fff; border:none; padding:8px 14px; border-radius:6px; font-size:15px; }
        .header-title { flex:1; text-align:center; font-size:19px; font-weight:bold; }

        .visitor-item {
            background:#fff; padding:16px; border-radius:10px; margin-bottom:10px;
            display:flex; justify-content:space-between; align-items:center;
            box-shadow:0 1px 4px rgba(0,0,0,0.05);
        }
        .visitor-name { font-size:17px; font-weight:bold; margin-bottom:4px; }
        .visitor-time { font-size:13px; color:#999; }
        .status { padding:4px 10px; border-radius:20px; font-size:12px; }
        .status-visited { background:#e6f7ff; color:#1890ff; }
        .status-light { background:#f0f9ff; color:#2979ff; }
        .status-gift { background:#fff7e6; color:#fa8c16; }
        .empty-tip { text-align:center; color:#999; margin-top:30px; font-size:15px; }
    </style>
</head>
<body>

<div class="page-header">
    <button class="back-btn" onclick="history.back()">← 返回</button>
    <div class="header-title">来宾记录</div>
</div>

<div id="visitorList"></div>
<div class="empty-tip" id="emptyTip">暂无来宾记录</div>

<script>
function loadVisitors() {
  let list = JSON.parse(localStorage.getItem('visitors') || '[]')
  let html = ''
  list.forEach(item => {
    let statusText = ''
    let statusClass = ''
    if (item.action === 'gift') {
      statusText = '已随礼'
      statusClass = 'status-gift'
    } else if (item.action === 'light') {
      statusText = '已点烛'
      statusClass = 'status-light'
    } else {
      statusText = '已访问'
      statusClass = 'status-visited'
    }
    html += `
    <div class="visitor-item">
      <div>
        <div class="visitor-name">${item.name}</div>
        <div class="visitor-time">${item.time} 到访</div>
      </div>
      <span class="status ${statusClass}">${statusText}</span>
    </div>`
  })
  document.getElementById('visitorList').innerHTML = html
  document.getElementById('emptyTip').style.display = list.length ? 'none' : 'block'
}
window.onload = loadVisitors
</script>

</body>
</html>
