<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>讣告管理</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 20px 15px; }
        .obit-item {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .obit-info { flex: 1; }
        .obit-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .obit-time { font-size: 14px; color: #999; }
        .obit-actions { display: flex; gap: 10px; }
        .action-btn {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .edit-btn { background-color: #2979ff; color: #fff; }
        .del-btn { background-color: #eee; color: #333; }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="header-title">讣告管理</div>
    </div>

    <div class="content-wrap">
        <div class="obit-item">
            <div class="obit-info">
                <div class="obit-name">高山女士 讣告</div>
                <div class="obit-time">创建时间：2018-08-08</div>
            </div>
            <div class="obit-actions">
                <button class="action-btn edit-btn" onclick="location.href='edit_obituary.html'">编辑</button>
                <button class="action-btn del-btn">删除</button>
            </div>
        </div>
        <div class="empty-tip">暂无更多讣告记录</div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
