<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>尽孝常识</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .header {
            background-color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }
        .tab-bar {
            display: flex;
            background-color: #fff;
            border-bottom: 1px solid #eee;
            overflow-x: auto;
        }
        .tab-item {
            flex: 0 0 auto;
            padding: 12px 18px;
            font-size: 16px;
            color: #666;
            white-space: nowrap;
        }
        .tab-item.active {
            color: #2979ff;
            border-bottom: 2px solid #2979ff;
        }
        .search-box {
            padding: 15px;
            background-color: #fff;
        }
        .article-list {padding: 15px;}
        .article-item {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        .article-info {
            flex: 1;
            padding-right: 15px;
        }
        .article-title {
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .article-meta {
            font-size: 13px;
            color: #999;
        }
        .article-img {
            width: 80px;
            height: 80px;
            border-radius: 6px;
            background-color: #e3f2fd;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#2979ff;
        }
    </style>
</head>
<body>
    <div class="header">尽孝常识</div>
    <div class="tab-bar">
        <div class="tab-item active">全部文章</div>
        <div class="tab-item">日常尽孝</div>
        <div class="tab-item">往生常识</div>
        <div class="tab-item">陪护照料</div>
        <div class="tab-item">名人故事</div>
    </div>
    <div class="search-box">
        <input type="text" class="form-input" placeholder="请输入关键字">
    </div>
    <div class="article-list">
        <div class="article-item">
            <div class="article-info">
                <div class="article-title">父母不“狠心”，很多教育都是无用的！</div>
                <div class="article-meta">2020/5/10  阅读：744</div>
            </div>
            <div class="article-img">图文</div>
        </div>
        <div class="article-item">
            <div class="article-info">
                <div class="article-title">《年华易逝，父母渐老》用心陪伴才是最长情的告白</div>
                <div class="article-meta">2020/5/10  阅读：870</div>
            </div>
            <div class="article-img"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
